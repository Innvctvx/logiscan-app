  <head>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>LogiScan Grouper</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
      }
      
      /* --- Scanner UI Customization --- */
      
      /* Hide the borders and default background of the reader */
      #reader {
        border: none !important;
        width: 100% !important;
      }
      
      /* Hide the large default "Phone" icon/illustration to save space */
      #reader img[alt="Info icon"] {
        display: none !important;
      }
      
      /* Hide the "Powered by..." text */
      #reader div[style*="opacity: 0.8"] {
        display: none !important;
      }

      /* Style the "Request Camera Permissions" link to look like a primary button */
      #reader__dashboard_section_csr a {
        display: inline-block;
        background-color: #2563eb; /* blue-600 */
        color: white !important;
        text-decoration: none !important;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        margin-top: 10px;
        margin-bottom: 10px;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }

      /* Hide the "Scan an Image File" link to avoid confusion if only camera is desired, 
         or just style it smaller if you want to keep it. Here I'll keep it but distinct. */
      #reader__dashboard_section_swaplink {
        text-decoration: underline !important;
        color: #475569 !important; /* slate-600 */
        font-size: 0.875rem;
        margin-top: 10px;
        display: block;
      }

      /* Ensure the select camera dropdown looks decent */
      #reader__dashboard_section_csr select {
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        margin-bottom: 10px;
        width: 100%;
        max-width: 300px;
      }
    </style>
