    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
      }
      
      /* --- Scanner UI Customization --- */
      
      /* Hide the borders and default background of the reader */
      #reader {
        border: none !important;
        width: 100% !important;
      }
      
      /* Hide the large default "Phone" icon/illustration to save space */
      #reader img[alt="Info icon"] {
        display: none !important;
      }
      
      /* Hide the "Powered by..." text */
      #reader div[style*="opacity: 0.8"] {
        display: none !important;
      }

      /* CRITICAL FIX: Force ALL text inside the reader dashboard to be white 
         This fixes the dark-blue-on-black issue for permission links */
      #reader__dashboard_section_csr span, 
      #reader__dashboard_section_csr a,
      #reader__dashboard_section_swaplink {
        color: white !important;
        text-decoration: none !important;
      }

      /* Specific style for the permission button to make it pop */
      #reader__dashboard_section_csr a {
        display: inline-block;
        background-color: #2563eb; /* blue-600 */
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        margin-top: 10px;
        margin-bottom: 10px;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(255,255,255,0.2);
      }

      /* Ensure select dropdowns are still readable (Black text on White bg) */
      #reader select {
        color: black !important;
        background-color: white !important;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        margin-bottom: 10px;
        width: 100%;
        max-width: 300px;
      }
    </style>
